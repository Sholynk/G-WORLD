<!doctype html>
<html lang="en" data-page="forgot-password">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reset your password · G WORLD</title>
    <meta name="description" content="Request a password reset link for your G WORLD account.">
    <link rel="canonical" href="https://gworld.pages.dev/forgot-password.html">
    <meta name="theme-color" content="#4f46e5">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="stylesheet" href="/assets/css/tokens.css">
    <link rel="stylesheet" href="/assets/css/base.css">
    <link rel="stylesheet" href="/assets/css/layout.css">
    <link rel="stylesheet" href="/assets/css/components.css">
    <link rel="stylesheet" href="/assets/css/forms.css">
    <link rel="stylesheet" href="/assets/css/tables.css">
    <link rel="stylesheet" href="/assets/css/animations.css">
    <!-- Public runtime configuration (no secrets). Loaded before the modules. -->
    <script src="/config.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>

    <!-- Header and footer are rendered by assets/js/components/*.js so the
         navigation exists in exactly one place. -->
    <header class="site-header" data-site-header></header>

    <main id="main" class="site-main" tabindex="-1">
      <div class="container container--narrow">
        <div class="page-head">
          <h1>Forgot your password?</h1>
          <p class="lede mb-0">
            Enter your email address and we will send a reset link. The link works once and
            expires after an hour.
          </p>
        </div>

        <form class="form form--narrow" data-forgot-form novalidate>
          <div class="field">
            <label for="email">Email address</label>
            <input id="email" name="email" type="email" autocomplete="email" required>
          </div>
          <div class="form__actions">
            <button class="btn btn--primary" type="submit">Send reset link</button>
            <a class="btn btn--ghost" href="/login.html">Back to sign in</a>
          </div>
          <p class="form-status" data-form-status role="status" aria-live="polite"></p>
          <p class="subtle">
            For privacy we show the same confirmation whether or not an account exists for
            that address.
          </p>
        </form>

        <div data-page-error></div>
      </div>

    </main>

    <footer class="site-footer" data-site-footer></footer>

    <noscript>
      <div class="container alert alert--warning mb-4">
        <p><strong>JavaScript is off.</strong> Browsing, reading lesson previews and
        verifying a certificate still work, because each page ships real HTML and the
        server renders the content. Signing in, enrolling, tracking progress and taking
        quizzes need JavaScript — the whole app is a set of ES modules talking to the
        G WORLD API.</p>
      </div>
    </noscript>

    <script type="module">
      import { boot } from '/assets/js/core/boot.js';
      import { init } from '/assets/js/pages/forgot-password.js';
      boot(init);
    </script>
  </body>
</html>
