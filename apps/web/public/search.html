<!doctype html>
<html lang="en" data-page="search">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Search · G WORLD</title>
    <meta name="description" content="Search G WORLD departments, subjects, courses and lessons.">
    <link rel="canonical" href="https://g-world.pages.dev/search.html">
    <meta name="theme-color" content="#0C7ABF">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="stylesheet" href="/assets/css/tokens.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600&family=Sora:wght@600;700&display=swap">
    <link rel="stylesheet" href="/assets/css/base.css">
    <link rel="stylesheet" href="/assets/css/layout.css">
    <link rel="stylesheet" href="/assets/css/components.css">
    <link rel="stylesheet" href="/assets/css/forms.css">
    <link rel="stylesheet" href="/assets/css/tables.css">
    <link rel="stylesheet" href="/assets/css/animations.css">
    <!-- Public runtime configuration (no secrets). Loaded before the modules. -->
    <script src="/config.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>

    <header class="site-header" data-site-header>
      <div class="site-nav">
        <div class="site-nav__inner container">
          <a class="brand" href="/index.html">G WORLD</a>

          <nav class="site-nav__links" aria-label="Main">
            <a class="site-nav__link" href="/departments.html">Departments</a>
            <a class="site-nav__link" href="/subjects.html">Subjects</a>
            <a class="site-nav__link" href="/courses.html">Courses</a>
          </nav>

          <div class="site-nav__actions">
            <a class="site-nav__link" data-nav-login href="/login.html">Log in</a>
            <a class="site-nav__link" data-nav-session data-nav-learning href="/dashboard.html" hidden>My learning</a>
            <span class="site-nav__name" data-nav-session data-nav-name hidden></span>
            <a class="btn" data-nav-register href="/register.html">Register</a>
          </div>

          <details class="site-nav__menu">
            <summary class="btn o">Menu</summary>
            <div class="site-nav__panel">
              <a class="site-nav__link" href="/departments.html">Departments</a>
              <a class="site-nav__link" href="/subjects.html">Subjects</a>
              <a class="site-nav__link" href="/courses.html">Courses</a>
              <a class="site-nav__link" data-nav-login href="/login.html">Log in</a>
              <a class="site-nav__link" data-nav-session data-nav-learning href="/dashboard.html" hidden>My learning</a>
              <a class="btn" data-nav-register href="/register.html">Register</a>
            </div>
          </details>
        </div>
      </div>
    </header>

    <main id="main" class="site-main" tabindex="-1">
      <div class="container">
        <div class="page-head">
          <h1>Search</h1>
          <p class="lede">Departments, subjects, courses and lessons — one query.</p>
        </div>

        <form class="toolbar mb-5" role="search" data-search-form>
          <div class="search-input">
            <label class="visually-hidden" for="q">Search term</label>
            <input id="q" name="q" type="search" autocomplete="off" required minlength="2"
              placeholder="Search courses, subjects and lessons">
            <button class="btn btn--primary" type="submit">Search</button>
          </div>
          <label class="field" style="flex: 0 1 12rem;">
            <span class="field__label">Type</span>
            <select name="type">
              <option value="all">Everything</option>
              <option value="course">Courses</option>
              <option value="lesson">Lessons</option>
              <option value="subject">Subjects</option>
              <option value="department">Departments</option>
            </select>
          </label>
        </form>

        <p class="subtle" data-search-count role="status" aria-live="polite"></p>
        <div class="stack-lg" data-search-results aria-busy="false"></div>

        <div data-page-error></div>
      </div>

    </main>

    <footer class="site-footer" data-site-footer>
      <div class="site-footer__inner container">
        <p class="site-footer__brand" data-footer-site>G WORLD</p>
        <nav class="site-footer__links" aria-label="Footer">
          <a href="/departments.html">Departments</a>
          <span class="site-footer__sep" aria-hidden="true">·</span>
          <a href="/subjects.html">Subjects</a>
          <span class="site-footer__sep" aria-hidden="true">·</span>
          <a href="/courses.html">Courses</a>
          <span class="site-footer__sep" aria-hidden="true">·</span>
          <a href="mailto:support@gworld.example" data-footer-email>support@gworld.example</a>
        </nav>
      </div>
    </footer>

    <noscript>
      <div class="container alert alert--warning mb-4">
        <p><strong>JavaScript is off.</strong> Browsing, reading lesson previews and
        verifying a certificate still work, because each page ships real HTML and the
        server renders the content. Signing in, enrolling, tracking progress and taking
        quizzes need JavaScript — the whole app is a set of ES modules talking to the
        G WORLD API.</p>
      </div>
    </noscript>

    <script type="module">
      import { boot } from '/assets/js/core/boot.js';
      import { init } from '/assets/js/pages/search.js';
      boot(init);
    </script>
  </body>
</html>
