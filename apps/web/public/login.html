<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1" name="viewport" />
    <title>Sign in - Sholynk Tech</title>
    <meta content="Editorial sign-in for the Sholynk Tech CMS." name="description" />
    <meta content="noindex, nofollow" name="robots" />
    <meta content="#000000" name="theme-color" />
    <link rel="canonical" href="./" />
    <link rel="shortcut icon" href="assets/brand/sholynk_icon.png" type="image/png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&amp;display=swap"
      rel="stylesheet"
    />
    <link href="styles.css" rel="stylesheet" />
  </head>
  <body class="auth-view">
    <header class="site-header">
      <div class="site-header-inner">
        <a href="index.html" aria-label="Sholynk homepage">
          <img
            alt="Sholynk logo"
            class="site-logo"
            height="24"
            src="assets/brand/page_logo.png"
            width="120"
          />
        </a>
        <nav class="site-nav" aria-label="Primary navigation">
          <a href="index.html">Home</a>
          <a href="about.html">About</a>
          <a href="contact.html">Contact</a>
        </nav>
      </div>
    </header>

    <main class="auth-main" id="main-content">
      <section class="auth-card" aria-labelledby="login-title">
        <p class="eyebrow">Sholynk CMS</p>
        <h1 id="login-title">Editorial sign in</h1>
        <p class="auth-subtitle">
          Sign in with your editorial account to open the content dashboard.
        </p>

        <form id="loginForm" class="auth-form" novalidate>
          <div class="form-field">
            <label for="email">Email</label>
            <input
              id="email"
              name="email"
              type="email"
              autocomplete="email"
              placeholder="you@example.com"
              required
            />
          </div>
          <div class="form-field">
            <label for="password">Password</label>
            <input
              id="password"
              name="password"
              type="password"
              autocomplete="current-password"
              placeholder="Your password"
              required
            />
          </div>
          <label class="auth-remember">
            <input id="remember" name="remember" type="checkbox" />
            Keep me signed in on this device
          </label>
          <button class="btn-primary auth-submit" type="submit">
            <i class="fas fa-right-to-bracket" aria-hidden="true"></i> Sign in
          </button>
          <p class="form-status" id="loginStatus" role="status" aria-live="polite"></p>
        </form>

        <p class="auth-links">
          <a href="reset.html">Forgot your password?</a>
          <a href="index.html">Back to the site</a>
        </p>
      </section>
    </main>

    <footer class="site-footer">
      <div class="footer-legal">
        &copy; <span id="copyrightYear"></span> Sholynk Tech | All Rights Reserved.
      </div>
    </footer>
    <script src="script.js"></script>
    <script src="login.js"></script>
  </body>
</html>
