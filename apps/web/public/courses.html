<!doctype html>
<html lang="en" data-page="courses">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Course catalogue · G WORLD</title>
    <meta name="description" content="Every published G WORLD course, filtered by department, subject, difficulty and length.">
    <link rel="canonical" href="https://gworld.pages.dev/courses.html">
    <meta name="theme-color" content="#4f46e5">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="stylesheet" href="/assets/css/tokens.css">
    <link rel="stylesheet" href="/assets/css/base.css">
    <link rel="stylesheet" href="/assets/css/layout.css">
    <link rel="stylesheet" href="/assets/css/components.css">
    <link rel="stylesheet" href="/assets/css/forms.css">
    <link rel="stylesheet" href="/assets/css/tables.css">
    <link rel="stylesheet" href="/assets/css/animations.css">
    <!-- Public runtime configuration (no secrets). Loaded before the modules. -->
    <script src="/config.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>

    <!-- Header and footer are rendered by assets/js/components/*.js so the
         navigation exists in exactly one place. -->
    <header class="site-header" data-site-header></header>

    <main id="main" class="site-main" tabindex="-1">
      <div class="container">
        <div class="page-head">
          <p class="page-head__eyebrow">Catalogue</p>
          <h1>Courses</h1>
          <p class="lede">
            Filter by department, subject or difficulty. Every course lists its modules,
            lessons and the assessments you must pass to be certified.
          </p>
        </div>

        <form class="card-grid-toolbar" data-course-filters role="search" aria-label="Filter courses">
          <label class="field" style="flex: 1 1 16rem;">
            <span class="field__label">Search</span>
            <input type="search" name="q" placeholder="Try “css”, “data” or “business”" autocomplete="off">
          </label>
          <label class="field" style="flex: 0 1 12rem;">
            <span class="field__label">Department</span>
            <select name="department" data-filter-department>
              <option value="">All</option>
            </select>
          </label>
          <label class="field" style="flex: 0 1 12rem;">
            <span class="field__label">Subject</span>
            <select name="subject" data-filter-subject>
              <option value="">All</option>
            </select>
          </label>
          <label class="field" style="flex: 0 1 10rem;">
            <span class="field__label">Difficulty</span>
            <select name="difficulty">
              <option value="">All</option>
              <option value="beginner">Beginner</option>
              <option value="intermediate">Intermediate</option>
              <option value="advanced">Advanced</option>
            </select>
          </label>
          <label class="field" style="flex: 0 1 10rem;">
            <span class="field__label">Sort</span>
            <select name="sort">
              <option value="newest">Newest</option>
              <option value="oldest">Oldest</option>
              <option value="title">Title</option>
              <option value="duration">Duration</option>
              <option value="difficulty">Difficulty</option>
            </select>
          </label>
          <button class="btn" type="reset" data-filter-reset>Clear</button>
        </form>

        <p class="subtle" data-result-count role="status" aria-live="polite"></p>
        <div class="grid grid--cards" data-course-list aria-busy="true"></div>
        <nav class="pagination" data-pagination aria-label="Course pages"></nav>

        <div data-page-error></div>
      </div>

    </main>

    <footer class="site-footer" data-site-footer></footer>

    <noscript>
      <div class="container alert alert--warning mb-4">
        <p><strong>JavaScript is off.</strong> Browsing, reading lesson previews and
        verifying a certificate still work, because each page ships real HTML and the
        server renders the content. Signing in, enrolling, tracking progress and taking
        quizzes need JavaScript — the whole app is a set of ES modules talking to the
        G WORLD API.</p>
      </div>
    </noscript>

    <script type="module">
      import { boot } from '/assets/js/core/boot.js';
      import { init } from '/assets/js/pages/courses.js';
      boot(init);
    </script>
  </body>
</html>
