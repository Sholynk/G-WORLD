<!doctype html>
<html lang="en" data-page="admin-audit">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Audit log · G WORLD</title>
    <meta name="description" content="Every privileged action, who took it, and what changed.">
    <link rel="canonical" href="https://g-world.pages.dev/admin/audit.html">
    <meta name="theme-color" content="#0C7ABF">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="stylesheet" href="/assets/css/tokens.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600&family=Sora:wght@600;700&display=swap">
    <link rel="stylesheet" href="/assets/css/base.css">
    <link rel="stylesheet" href="/assets/css/layout.css">
    <link rel="stylesheet" href="/assets/css/components.css">
    <link rel="stylesheet" href="/assets/css/forms.css">
    <link rel="stylesheet" href="/assets/css/tables.css">
    <link rel="stylesheet" href="/assets/css/animations.css">
    <!-- Public runtime configuration (no secrets). Loaded before the modules. -->
    <script src="/config.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>


    <div class="app-shell">
      <header class="app-topbar">
        <a class="brand" href="/index.html">G WORLD</a>
        <div class="cluster">
          <span class="app-topbar__name" data-session-name>[Admin name]</span>
          <button class="btn o" type="button" data-sign-out>Sign out</button>
        </div>
      </header>

      <aside class="app-sidebar">
        <nav aria-label="Administration sections">
        <a class="app-sidebar__link" href="/admin/index.html">Analytics</a>
        <a class="app-sidebar__link" href="/admin/students.html">Users</a>
        <a class="app-sidebar__link" href="/admin/courses.html">Courses</a>
        <a class="app-sidebar__link" href="/admin/content.html">Content</a>
        <a class="app-sidebar__link" href="/admin/scan.html">QR scanner</a>
        </nav>
      </aside>

      <main id="main" class="app-main app-page" tabindex="-1">
<div class="page-head">
          <p class="page-head__eyebrow">Administration</p>
          <h2>Audit log</h2>
          <p class="lede mb-0">Append-only: entries are written by the API for privileged actions and are never edited or deleted.</p>
        </div>

            <form class="card-grid-toolbar" data-audit-filters role="search" aria-label="Filter audit entries">
              <label class="field" style="flex: 1 1 14rem;">
                <span class="field__label">Action</span>
                <input type="search" name="action" autocomplete="off" placeholder="course.published">
              </label>
              <label class="field" style="flex: 0 1 12rem;">
                <span class="field__label">Entity type</span>
                <input type="search" name="entity_type" autocomplete="off" placeholder="course">
              </label>
              <label class="field" style="flex: 0 1 12rem;">
                <span class="field__label">Actor user id</span>
                <input type="search" name="actor" autocomplete="off" placeholder="usr_…">
              </label>
              <button class="btn" type="submit">Apply</button>
            </form>

            <div class="stat-grid mb-5" data-audit-summary aria-busy="true"></div>
            <div class="table-wrap" data-audit-table aria-busy="true"></div>
            <nav class="pagination" data-pagination aria-label="Audit pages"></nav>

        <div data-page-error></div>

        <div data-page-error></div>
      </main>
    </div>



    <script type="module">
      import { boot } from '/assets/js/core/boot.js';
      import { init } from '/assets/js/pages/admin/audit.js';
      boot(init);
    </script>
  </body>
</html>
