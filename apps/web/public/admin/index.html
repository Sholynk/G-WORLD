<!doctype html>
<html lang="en" data-page="admin-analytics">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Analytics · G WORLD</title>
    <meta name="description" content="Users, enrolments, active courses, certificates issued and enrolment trends.">
    <link rel="canonical" href="https://g-world.pages.dev/admin/index.html">
    <meta name="theme-color" content="#0C7ABF">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600&family=Sora:wght@600;700&display=swap">
    <link rel="stylesheet" href="/assets/css/tokens.css">
    <link rel="stylesheet" href="/assets/css/base.css">
    <link rel="stylesheet" href="/assets/css/layout.css">
    <link rel="stylesheet" href="/assets/css/components.css">
    <link rel="stylesheet" href="/assets/css/forms.css">
    <link rel="stylesheet" href="/assets/css/tables.css">
    <link rel="stylesheet" href="/assets/css/animations.css">
    <!-- Public runtime configuration (no secrets). Loaded before the modules. -->
    <script src="/config.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>

    <div class="app-shell">
      <header class="app-topbar">
        <a class="brand" href="/index.html">G WORLD</a>
        <div class="cluster">
          <span class="app-topbar__name" data-session-name>[Admin name]</span>
          <button class="btn o" type="button" data-sign-out>Sign out</button>
        </div>
      </header>

      <aside class="app-sidebar">
        <nav aria-label="Administration sections">
        <a class="app-sidebar__link" href="/admin/index.html" aria-current="page">Analytics</a>
        <a class="app-sidebar__link" href="/admin/students.html">Users</a>
        <a class="app-sidebar__link" href="/admin/courses.html">Courses</a>
        <a class="app-sidebar__link" href="/admin/content.html">Content</a>
        <a class="app-sidebar__link" href="/admin/scan.html">QR scanner</a>
        </nav>
      </aside>

      <main id="main" class="app-main app-page" tabindex="-1">
        <h2>Analytics</h2>

        <div class="stat-grid" data-admin-stats aria-busy="true"></div>

        <section class="section" aria-labelledby="trend-heading">
          <div class="section__head">
            <div>
              <h2 id="trend-heading">Enrollments over time</h2>
              <p class="muted mb-0">New enrollments in each of the last seven months.</p>
            </div>
          </div>

          <div class="card">
            <div class="card__section" data-admin-trend aria-busy="true"></div>
          </div>
        </section>

        <section class="section" aria-labelledby="recent-heading">
          <div class="section__head">
            <div>
              <h2 id="recent-heading">Recent enrollments</h2>
              <p class="muted mb-0">The latest learners to join a course.</p>
            </div>
          </div>

          <div class="table-wrap" data-admin-enrollments aria-busy="true"></div>
        </section>
        <div data-page-error></div>
      </main>
    </div>

    <script type="module">
      import { boot } from '/assets/js/core/boot.js';
      import { init } from '/assets/js/pages/admin/analytics.js';
      boot(init);
    </script>
  </body>
</html>
