<!doctype html>
<html lang="en" data-page="admin-scan">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>QR scanner · G WORLD</title>
    <meta name="description" content="Scan a learner or certificate QR code and verify it on the spot.">
    <link rel="canonical" href="https://g-world.pages.dev/admin/scan.html">
    <meta name="theme-color" content="#0C7ABF">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600&family=Sora:wght@600;700&display=swap">
    <link rel="stylesheet" href="/assets/css/tokens.css">
    <link rel="stylesheet" href="/assets/css/base.css">
    <link rel="stylesheet" href="/assets/css/layout.css">
    <link rel="stylesheet" href="/assets/css/components.css">
    <link rel="stylesheet" href="/assets/css/forms.css">
    <link rel="stylesheet" href="/assets/css/tables.css">
    <link rel="stylesheet" href="/assets/css/animations.css">
    <!-- Public runtime configuration (no secrets). Loaded before the modules. -->
    <script src="/config.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>

    <div class="app-shell">
      <header class="app-topbar">
        <a class="brand" href="/index.html">G WORLD</a>
        <div class="cluster">
          <span class="app-topbar__name" data-session-name>[Admin name]</span>
          <button class="btn o" type="button" data-sign-out>Sign out</button>
        </div>
      </header>

      <aside class="app-sidebar">
        <nav aria-label="Administration sections">
        <a class="app-sidebar__link" href="/admin/index.html">Analytics</a>
        <a class="app-sidebar__link" href="/admin/students.html">Users</a>
        <a class="app-sidebar__link" href="/admin/courses.html">Courses</a>
        <a class="app-sidebar__link" href="/admin/content.html">Content</a>
        <a class="app-sidebar__link" href="/admin/scan.html" aria-current="page">QR scanner</a>
        </nav>
      </aside>

      <main id="main" class="app-main app-page" tabindex="-1">
        <h2>QR scanner</h2>

        <div class="grid grid--2">
          <div class="card">
            <div class="card__section stack-sm">
              <h3 class="card__title">Camera preview</h3>
              <div class="qr-frame" data-scan-frame>
                <span class="qr-frame__label">Camera preview</span>
                <video data-scan-video playsinline muted hidden></video>
              </div>
              <div class="btn-row">
                <button class="btn" type="button" data-scan-start>Start camera</button>
                <button class="btn o" type="button" data-scan-stop hidden>Stop camera</button>
              </div>
            </div>
          </div>

          <div class="card">
            <div class="card__section stack-sm">
              <h3 class="card__title">Verify a code</h3>
              <form class="form" data-scan-form novalidate>
                <div class="field">
                  <label for="code">Code</label>
                  <input id="code" name="code" type="text" class="code-input" required placeholder="XK4T-9QW2-M7PL" autocomplete="off">
                </div>
                <button class="btn btn--block" type="submit">Verify</button>
                <p class="form-status" data-scan-status role="status" aria-live="polite"></p>
              </form>
            </div>
          </div>
        </div>

        <section class="section" aria-labelledby="scan-result-heading" data-scan-result hidden>
          <div class="section__head">
            <div>
              <h2 id="scan-result-heading">Certificate verified</h2>
            </div>
          </div>
          <div class="card" data-scan-result-card></div>
        </section>
        <div data-page-error></div>
      </main>
    </div>

    <script type="module">
      import { boot } from '/assets/js/core/boot.js';
      import { init } from '/assets/js/pages/admin/scan.js';
      boot(init);
    </script>
  </body>
</html>
