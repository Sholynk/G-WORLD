<!doctype html>
<html lang="en" data-page="admin-certificates">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Certificates · G WORLD</title>
    <meta name="description" content="Issue, review and revoke certificates.">
    <link rel="canonical" href="https://g-world.pages.dev/admin/certificates.html">
    <meta name="theme-color" content="#0C7ABF">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="stylesheet" href="/assets/css/tokens.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600&family=Sora:wght@600;700&display=swap">
    <link rel="stylesheet" href="/assets/css/base.css">
    <link rel="stylesheet" href="/assets/css/layout.css">
    <link rel="stylesheet" href="/assets/css/components.css">
    <link rel="stylesheet" href="/assets/css/forms.css">
    <link rel="stylesheet" href="/assets/css/tables.css">
    <link rel="stylesheet" href="/assets/css/animations.css">
    <!-- Public runtime configuration (no secrets). Loaded before the modules. -->
    <script src="/config.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>


    <div class="app-shell">
      <header class="app-topbar">
        <a class="brand" href="/index.html">G WORLD</a>
        <div class="cluster">
          <span class="app-topbar__name" data-session-name>[Admin name]</span>
          <button class="btn o" type="button" data-sign-out>Sign out</button>
        </div>
      </header>

      <aside class="app-sidebar">
        <nav aria-label="Administration sections">
        <a class="app-sidebar__link" href="/admin/index.html">Analytics</a>
        <a class="app-sidebar__link" href="/admin/students.html">Users</a>
        <a class="app-sidebar__link" href="/admin/courses.html">Courses</a>
        <a class="app-sidebar__link" href="/admin/content.html">Content</a>
        <a class="app-sidebar__link" href="/admin/scan.html">QR scanner</a>
        </nav>
      </aside>

      <main id="main" class="app-main app-page" tabindex="-1">
<div class="page-head">
          <p class="page-head__eyebrow">Administration</p>
          <h2>Certificates</h2>
          <p class="lede mb-0">A certificate is unique per learner and course. Re-issuing returns the existing record instead of duplicating it.</p>
        </div>

            <section class="card" aria-labelledby="issue-heading">
              <div class="card__section stack-sm">
                <h2 id="issue-heading" class="card__title">Issue a certificate</h2>
                <form class="form" data-issue-form novalidate>
                  <div class="field-row">
                    <div class="field">
                      <label for="user_id">Learner id</label>
                      <input id="user_id" name="user_id" type="text" required placeholder="usr_…">
                    </div>
                    <div class="field">
                      <label for="course_id">Course id</label>
                      <input id="course_id" name="course_id" type="text" required placeholder="crs_…">
                    </div>
                    <div class="field">
                      <label for="grade">Grade <span class="subtle">(optional)</span></label>
                      <select id="grade" name="grade">
                        <option value="">Derive from score</option>
                        <option value="pass">Pass</option>
                        <option value="merit">Merit</option>
                        <option value="distinction">Distinction</option>
                      </select>
                    </div>
                  </div>
                  <div class="form__actions">
                    <button class="btn btn--primary" type="submit">Issue certificate</button>
                    <span class="form-status" data-issue-status role="status" aria-live="polite"></span>
                  </div>
                </form>
              </div>
            </section>

            <section aria-labelledby="list-heading">
              <h2 id="list-heading">Issued certificates</h2>
              <div class="table-wrap" data-certificate-table aria-busy="true"></div>
              <nav class="pagination" data-pagination aria-label="Certificate pages"></nav>
            </section>

        <div data-page-error></div>

        <div data-page-error></div>
      </main>
    </div>



    <script type="module">
      import { boot } from '/assets/js/core/boot.js';
      import { init } from '/assets/js/pages/admin/certificates.js';
      boot(init);
    </script>
  </body>
</html>
