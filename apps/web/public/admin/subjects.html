<!doctype html>
<html lang="en" data-page="admin-subjects">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Subjects · G WORLD</title>
    <meta name="description" content="Subjects group courses inside a department.">
    <link rel="canonical" href="https://g-world.pages.dev/admin/subjects.html">
    <meta name="theme-color" content="#0C7ABF">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="stylesheet" href="/assets/css/tokens.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600&family=Sora:wght@600;700&display=swap">
    <link rel="stylesheet" href="/assets/css/base.css">
    <link rel="stylesheet" href="/assets/css/layout.css">
    <link rel="stylesheet" href="/assets/css/components.css">
    <link rel="stylesheet" href="/assets/css/forms.css">
    <link rel="stylesheet" href="/assets/css/tables.css">
    <link rel="stylesheet" href="/assets/css/animations.css">
    <!-- Public runtime configuration (no secrets). Loaded before the modules. -->
    <script src="/config.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>


    <div class="app-shell">
      <header class="app-topbar">
        <a class="brand" href="/index.html">G WORLD</a>
        <div class="cluster">
          <span class="app-topbar__name" data-session-name>[Admin name]</span>
          <button class="btn o" type="button" data-sign-out>Sign out</button>
        </div>
      </header>

      <aside class="app-sidebar">
        <nav aria-label="Administration sections">
        <a class="app-sidebar__link" href="/admin/index.html">Analytics</a>
        <a class="app-sidebar__link" href="/admin/students.html">Users</a>
        <a class="app-sidebar__link" href="/admin/courses.html">Courses</a>
        <a class="app-sidebar__link" href="/admin/content.html">Content</a>
        <a class="app-sidebar__link" href="/admin/scan.html">QR scanner</a>
        </nav>
      </aside>

      <main id="main" class="app-main app-page" tabindex="-1">
<div class="page-head">
          <p class="page-head__eyebrow">Administration</p>
          <h2>Subjects</h2>
          <p class="lede mb-0">A subject belongs to exactly one department; a course belongs to exactly one subject.</p>
        </div>

            <section class="card" aria-labelledby="new-subject-heading">
              <div class="card__section stack-sm">
                <h2 id="new-subject-heading" class="card__title">New subject</h2>
                <form class="form" data-subject-form novalidate>
                  <div class="field-row">
                    <div class="field">
                      <label for="department_id">Department</label>
                      <select id="department_id" name="department_id" required data-department-select></select>
                    </div>
                    <div class="field">
                      <label for="name">Name</label>
                      <input id="name" name="name" type="text" required minlength="2" maxlength="120">
                    </div>
                    <div class="field">
                      <label for="status">Status</label>
                      <select id="status" name="status">
                        <option value="draft">Draft</option>
                        <option value="published">Published</option>
                        <option value="archived">Archived</option>
                      </select>
                    </div>
                  </div>
                  <div class="field">
                    <label for="description">Description</label>
                    <textarea id="description" name="description" rows="3" maxlength="5000"></textarea>
                  </div>
                  <div class="form__actions">
                    <button class="btn btn--primary" type="submit">Create subject</button>
                    <span class="form-status" data-subject-status role="status" aria-live="polite"></span>
                  </div>
                </form>
              </div>
            </section>

            <section aria-labelledby="subject-list-heading">
              <h2 id="subject-list-heading">All subjects</h2>
              <div class="table-wrap" data-subject-table aria-busy="true"></div>
            </section>

        <div data-page-error></div>

        <div data-page-error></div>
      </main>
    </div>



    <script type="module">
      import { boot } from '/assets/js/core/boot.js';
      import { init } from '/assets/js/pages/admin/subjects.js';
      boot(init);
    </script>
  </body>
</html>
