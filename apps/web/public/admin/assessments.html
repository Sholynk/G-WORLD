<!doctype html>
<html lang="en" data-page="admin-assessments">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Assessments · G WORLD</title>
    <meta name="description" content="Quizzes with their questions, and assignment submissions waiting for a grade.">
    <link rel="canonical" href="https://g-world.pages.dev/admin/assessments.html">
    <meta name="theme-color" content="#0C7ABF">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="stylesheet" href="/assets/css/tokens.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600&family=Sora:wght@600;700&display=swap">
    <link rel="stylesheet" href="/assets/css/base.css">
    <link rel="stylesheet" href="/assets/css/layout.css">
    <link rel="stylesheet" href="/assets/css/components.css">
    <link rel="stylesheet" href="/assets/css/forms.css">
    <link rel="stylesheet" href="/assets/css/tables.css">
    <link rel="stylesheet" href="/assets/css/animations.css">
    <!-- Public runtime configuration (no secrets). Loaded before the modules. -->
    <script src="/config.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>


    <div class="app-shell">
      <header class="app-topbar">
        <a class="brand" href="/index.html">G WORLD</a>
        <div class="cluster">
          <span class="app-topbar__name" data-session-name>[Admin name]</span>
          <button class="btn o" type="button" data-sign-out>Sign out</button>
        </div>
      </header>

      <aside class="app-sidebar">
        <nav aria-label="Administration sections">
        <a class="app-sidebar__link" href="/admin/index.html">Analytics</a>
        <a class="app-sidebar__link" href="/admin/students.html">Users</a>
        <a class="app-sidebar__link" href="/admin/courses.html">Courses</a>
        <a class="app-sidebar__link" href="/admin/content.html">Content</a>
        <a class="app-sidebar__link" href="/admin/scan.html">QR scanner</a>
        </nav>
      </aside>

      <main id="main" class="app-main app-page" tabindex="-1">
<div class="page-head">
          <p class="page-head__eyebrow">Administration</p>
          <h2>Assessments</h2>
          <p class="lede mb-0">Quiz answers are marked on the server from the stored option flags. Submissions are graded here.</p>
        </div>

            <section aria-labelledby="quizzes-heading">
              <div class="section__head">
                <h2 id="quizzes-heading">Quizzes</h2>
                <span class="subtle" data-quiz-count></span>
              </div>
              <div class="table-wrap" data-quiz-table aria-busy="true"></div>
            </section>

            <section aria-labelledby="quiz-detail-heading" data-quiz-detail hidden>
              <h2 id="quiz-detail-heading" data-quiz-detail-title>Quiz detail</h2>
              <div data-quiz-questions class="stack"></div>
            </section>

            <section aria-labelledby="submissions-heading">
              <div class="section__head">
                <h2 id="submissions-heading">Submissions</h2>
                <label class="field">
                  <span class="field__label">Status</span>
                  <select data-submission-status>
                    <option value="submitted">Awaiting a grade</option>
                    <option value="graded">Graded</option>
                    <option value="returned">Returned</option>
                    <option value="">Any</option>
                  </select>
                </label>
              </div>
              <div class="table-wrap" data-submission-table aria-busy="true"></div>
            </section>

        <div data-page-error></div>

        <div data-page-error></div>
      </main>
    </div>



    <script type="module">
      import { boot } from '/assets/js/core/boot.js';
      import { init } from '/assets/js/pages/admin/assessments.js';
      boot(init);
    </script>
  </body>
</html>
