<!doctype html>
<html lang="en" data-page="admin-students">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Users · G WORLD</title>
    <meta name="description" content="Every account on the platform: search accounts, review profiles and moderate access.">
    <link rel="canonical" href="https://g-world.pages.dev/admin/students.html">
    <meta name="theme-color" content="#0C7ABF">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="stylesheet" href="/assets/css/tokens.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600&family=Sora:wght@600;700&display=swap">
    <link rel="stylesheet" href="/assets/css/base.css">
    <link rel="stylesheet" href="/assets/css/layout.css">
    <link rel="stylesheet" href="/assets/css/components.css">
    <link rel="stylesheet" href="/assets/css/forms.css">
    <link rel="stylesheet" href="/assets/css/tables.css">
    <link rel="stylesheet" href="/assets/css/animations.css">
    <!-- Public runtime configuration (no secrets). Loaded before the modules. -->
    <script src="/config.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>


    <div class="app-shell">
      <header class="app-topbar">
        <a class="brand" href="/index.html">G WORLD</a>
        <div class="cluster">
          <span class="app-topbar__name" data-session-name>[Admin name]</span>
          <button class="btn o" type="button" data-sign-out>Sign out</button>
        </div>
      </header>

      <aside class="app-sidebar">
        <nav aria-label="Administration sections">
        <a class="app-sidebar__link" href="/admin/index.html">Analytics</a>
        <a class="app-sidebar__link" href="/admin/students.html" aria-current="page">Users</a>
        <a class="app-sidebar__link" href="/admin/courses.html">Courses</a>
        <a class="app-sidebar__link" href="/admin/content.html">Content</a>
        <a class="app-sidebar__link" href="/admin/scan.html">QR scanner</a>
        </nav>
      </aside>

      <main id="main" class="app-main app-page" tabindex="-1">
<div class="page-head">
          <p class="page-head__eyebrow">Administration</p>
          <h2>Users</h2>
          <p class="lede mb-0">Search by name, email or student number. Status changes and role assignments are audited.</p>
        </div>

            <form class="card-grid-toolbar" data-student-filters role="search" aria-label="Filter users">
              <label class="field" style="flex: 1 1 14rem;">
                <span class="field__label">Search</span>
                <input type="search" name="q" autocomplete="off" placeholder="Name, email or GW-2026-…">
              </label>
              <label class="field" style="flex: 0 1 11rem;">
                <span class="field__label">Status</span>
                <select name="status">
                  <option value="">Any</option>
                  <option value="active">Active</option>
                  <option value="pending_verification">Pending verification</option>
                  <option value="suspended">Suspended</option>
                  <option value="deactivated">Deactivated</option>
                </select>
              </label>
              <label class="field" style="flex: 0 1 11rem;">
                <span class="field__label">Role</span>
                <select name="role">
                  <option value="">Any</option>
                  <option value="student">Student</option>
                  <option value="admin">Administrator</option>
                  <option value="super_admin">Super administrator</option>
                </select>
              </label>
              <button class="btn" type="submit">Apply</button>
            </form>

            <p class="subtle" data-student-count role="status" aria-live="polite"></p>
            <div class="table-wrap" data-student-table aria-busy="true"></div>
            <nav class="pagination" data-pagination aria-label="User pages"></nav>

        <div data-page-error></div>

        <div data-page-error></div>
      </main>
    </div>



    <script type="module">
      import { boot } from '/assets/js/core/boot.js';
      import { init } from '/assets/js/pages/admin/students.js';
      boot(init);
    </script>
  </body>
</html>
