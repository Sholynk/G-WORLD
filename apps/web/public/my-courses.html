<!doctype html>
<html lang="en" data-page="my-courses">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>My courses · G WORLD</title>
    <meta name="description" content="Every G WORLD course you are enrolled in, with progress and next lessons.">
    <link rel="canonical" href="https://g-world.pages.dev/my-courses.html">
    <meta name="theme-color" content="#4f46e5">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="stylesheet" href="/assets/css/tokens.css">
    <link rel="stylesheet" href="/assets/css/base.css">
    <link rel="stylesheet" href="/assets/css/layout.css">
    <link rel="stylesheet" href="/assets/css/components.css">
    <link rel="stylesheet" href="/assets/css/forms.css">
    <link rel="stylesheet" href="/assets/css/tables.css">
    <link rel="stylesheet" href="/assets/css/animations.css">
    <link rel="stylesheet" href="/assets/css/visual-refresh.css">
    <!-- Public runtime configuration (no secrets). Loaded before the modules. -->
    <script src="/config.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>

    <!-- Header and footer are rendered by assets/js/components/*.js so the
         navigation exists in exactly one place. -->
    <header class="site-header" data-site-header></header>

    <main id="main" class="site-main" tabindex="-1">
      <div class="container">
        <div class="page-head">
          <p class="page-head__eyebrow">Your learning</p>
          <h1>My courses</h1>
          <p class="lede">Active, completed and cancelled enrolments.</p>
        </div>

        <div class="cluster mb-5" role="tablist" aria-label="Filter enrolments">
          <button class="btn btn--sm" type="button" role="tab" aria-selected="true" data-filter="all">All</button>
          <button class="btn btn--sm" type="button" role="tab" aria-selected="false" data-filter="active">In progress</button>
          <button class="btn btn--sm" type="button" role="tab" aria-selected="false" data-filter="completed">Completed</button>
          <button class="btn btn--sm" type="button" role="tab" aria-selected="false" data-filter="cancelled">Cancelled</button>
        </div>

        <p class="subtle" data-enrolment-count role="status" aria-live="polite"></p>
        <div class="grid grid--cards" data-enrolment-list aria-busy="true"></div>

        <div data-page-error></div>
      </div>

    </main>

    <footer class="site-footer" data-site-footer></footer>

    <noscript>
      <div class="container alert alert--warning mb-4">
        <p><strong>JavaScript is off.</strong> Browsing, reading lesson previews and
        verifying a certificate still work, because each page ships real HTML and the
        server renders the content. Signing in, enrolling, tracking progress and taking
        quizzes need JavaScript — the whole app is a set of ES modules talking to the
        G WORLD API.</p>
      </div>
    </noscript>

    <script type="module">
      import { boot } from '/assets/js/core/boot.js';
      import { init } from '/assets/js/pages/my-courses.js';
      boot(init);
    </script>
  </body>
</html>
