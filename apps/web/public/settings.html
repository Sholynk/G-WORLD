<!doctype html>
<html lang="en" data-page="settings">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Settings · G WORLD</title>
    <meta name="description" content="Password, sessions, QR identity card and account details for G WORLD.">
    <link rel="canonical" href="https://g-world.pages.dev/settings.html">
    <meta name="theme-color" content="#4f46e5">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="stylesheet" href="/assets/css/tokens.css">
    <link rel="stylesheet" href="/assets/css/base.css">
    <link rel="stylesheet" href="/assets/css/layout.css">
    <link rel="stylesheet" href="/assets/css/components.css">
    <link rel="stylesheet" href="/assets/css/forms.css">
    <link rel="stylesheet" href="/assets/css/tables.css">
    <link rel="stylesheet" href="/assets/css/animations.css">
    <link rel="stylesheet" href="/assets/css/visual-refresh.css">
    <!-- Public runtime configuration (no secrets). Loaded before the modules. -->
    <script src="/config.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>

    <!-- Header and footer are rendered by assets/js/components/*.js so the
         navigation exists in exactly one place. -->
    <header class="site-header" data-site-header></header>

    <main id="main" class="site-main" tabindex="-1">
      <div class="container">
        <div class="page-head">
          <p class="page-head__eyebrow">Account</p>
          <h1>Settings</h1>
          <p class="lede">Password, active sessions and your verifiable identity card.</p>
        </div>

        <div class="grid grid--two">
          <section aria-labelledby="password-heading" class="card">
            <div class="card__section stack-sm">
              <h2 id="password-heading" class="card__title">Change password</h2>
              <form class="form" data-password-form novalidate>
                <div class="field">
                  <label for="current_password">Current password</label>
                  <input id="current_password" name="current_password" type="password" autocomplete="current-password" required>
                </div>
                <div class="field">
                  <label for="new_password">New password</label>
                  <input id="new_password" name="new_password" type="password" autocomplete="new-password" required minlength="8">
                  <p class="field__hint">Changing your password signs out every other device.</p>
                </div>
                <div class="form__actions">
                  <button class="btn btn--primary" type="submit">Update password</button>
                  <span class="form-status" data-password-status role="status" aria-live="polite"></span>
                </div>
              </form>
            </div>
          </section>

          <section id="qr" aria-labelledby="qr-heading" class="card">
            <div class="card__section">
              <h2 id="qr-heading" class="card__title">Your QR identity card</h2>
              <div class="qr-card" data-qr-card aria-busy="true">
                <div class="qr-card__frame" data-qr-frame></div>
                <p class="qr-card__code" data-qr-code>—</p>
                <p class="subtle mb-0" data-qr-meta></p>
                <button class="btn btn--sm" type="button" data-qr-rotate>Issue a new code</button>
              </div>
            </div>
          </section>
        </div>

        <section class="section" aria-labelledby="sessions-heading">
          <div class="section__head">
            <div>
              <h2 id="sessions-heading">Active sessions</h2>
              <p class="muted mb-0">Every device currently signed in to your account.</p>
            </div>
            <button class="btn btn--sm" type="button" data-reload-sessions>Refresh</button>
          </div>
          <div class="table-wrap" data-session-list aria-busy="true"></div>
        </section>

        <div data-page-error></div>
      </div>

    </main>

    <footer class="site-footer" data-site-footer></footer>

    <noscript>
      <div class="container alert alert--warning mb-4">
        <p><strong>JavaScript is off.</strong> Browsing, reading lesson previews and
        verifying a certificate still work, because each page ships real HTML and the
        server renders the content. Signing in, enrolling, tracking progress and taking
        quizzes need JavaScript — the whole app is a set of ES modules talking to the
        G WORLD API.</p>
      </div>
    </noscript>

    <script type="module">
      import { boot } from '/assets/js/core/boot.js';
      import { init } from '/assets/js/pages/settings.js';
      boot(init);
    </script>
  </body>
</html>
