<!doctype html>
<html lang="en" data-page="browse">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Departments and subjects · G WORLD</title>
    <meta name="description" content="Explore every G WORLD department and the subjects and courses inside it.">
    <link rel="canonical" href="https://g-world.pages.dev/browse.html">
    <meta name="theme-color" content="#4f46e5">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="stylesheet" href="/assets/css/tokens.css">
    <link rel="stylesheet" href="/assets/css/base.css">
    <link rel="stylesheet" href="/assets/css/layout.css">
    <link rel="stylesheet" href="/assets/css/components.css">
    <link rel="stylesheet" href="/assets/css/forms.css">
    <link rel="stylesheet" href="/assets/css/tables.css">
    <link rel="stylesheet" href="/assets/css/animations.css">
    <link rel="stylesheet" href="/assets/css/visual-refresh.css">
    <!-- Public runtime configuration (no secrets). Loaded before the modules. -->
    <script src="/config.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>

    <!-- Header and footer are rendered by assets/js/components/*.js so the
         navigation exists in exactly one place. -->
    <header class="site-header" data-site-header></header>

    <main id="main" class="site-main" tabindex="-1">
      <div class="container">
        <div class="page-head">
          <p class="page-head__eyebrow">Catalogue</p>
          <h1>Departments and subjects</h1>
          <p class="lede">
            A department is a field of study. Inside it, subjects group the courses that
            teach a specific skill.
          </p>
        </div>

        <div class="grid grid--departments mb-5" data-browse-departments aria-busy="true"></div>

        <section class="section" aria-labelledby="subjects-heading">
          <div class="section__head">
            <div>
              <h2 id="subjects-heading">Subjects</h2>
              <p class="muted mb-0" data-subject-count>Loading subjects…</p>
            </div>
            <label class="field" style="min-inline-size: 14rem;">
              <span class="field__label">Filter by department</span>
              <select data-department-filter>
                <option value="">All departments</option>
              </select>
            </label>
          </div>
          <div class="grid grid--cards" data-subjects aria-busy="true"></div>
        </section>

        <div data-page-error></div>
      </div>

    </main>

    <footer class="site-footer" data-site-footer></footer>

    <noscript>
      <div class="container alert alert--warning mb-4">
        <p><strong>JavaScript is off.</strong> Browsing, reading lesson previews and
        verifying a certificate still work, because each page ships real HTML and the
        server renders the content. Signing in, enrolling, tracking progress and taking
        quizzes need JavaScript — the whole app is a set of ES modules talking to the
        G WORLD API.</p>
      </div>
    </noscript>

    <script type="module">
      import { boot } from '/assets/js/core/boot.js';
      import { init } from '/assets/js/pages/browse.js';
      boot(init);
    </script>
  </body>
</html>
