<!doctype html>
<html lang="en" data-page="certificate">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Certificate · G WORLD</title>
    <meta name="description" content="A G WORLD certificate with its verification code, holder and issue date.">
    <link rel="canonical" href="https://g-world.pages.dev/certificate.html">
    <meta name="theme-color" content="#4f46e5">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="stylesheet" href="/assets/css/tokens.css">
    <link rel="stylesheet" href="/assets/css/base.css">
    <link rel="stylesheet" href="/assets/css/layout.css">
    <link rel="stylesheet" href="/assets/css/components.css">
    <link rel="stylesheet" href="/assets/css/forms.css">
    <link rel="stylesheet" href="/assets/css/tables.css">
    <link rel="stylesheet" href="/assets/css/animations.css">
    <link rel="stylesheet" href="/assets/css/visual-refresh.css">
    <!-- Public runtime configuration (no secrets). Loaded before the modules. -->
    <script src="/config.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>

    <!-- Header and footer are rendered by assets/js/components/*.js so the
         navigation exists in exactly one place. -->
    <header class="site-header" data-site-header></header>

    <main id="main" class="site-main" tabindex="-1">
      <div class="container container--narrow">
        <p class="breadcrumbs"><a href="/certificates.html">Certificates</a> / <span data-certificate-crumb>Certificate</span></p>

        <div class="card" data-certificate-card aria-busy="true">
          <div class="card__section stack-sm">
            <p class="page-head__eyebrow">G WORLD · Certificate of completion</p>
            <h1 data-certificate-title>Loading…</h1>
            <p class="lede mb-0" data-certificate-holder></p>
          </div>
          <div class="card__footer">
            <dl class="detail-list">
              <div><dt>Certificate number</dt><dd class="mono" data-certificate-number>—</dd></div>
              <div><dt>Verification code</dt><dd class="mono" data-certificate-code>—</dd></div>
              <div><dt>Grade</dt><dd data-certificate-grade>—</dd></div>
              <div><dt>Score</dt><dd data-certificate-score>—</dd></div>
              <div><dt>Issued</dt><dd data-certificate-issued>—</dd></div>
              <div><dt>Status</dt><dd data-certificate-status>—</dd></div>
            </dl>
          </div>
        </div>

        <div class="cluster mt-5">
          <a class="btn btn--primary" data-certificate-verify>Verify publicly</a>
          <button class="btn" type="button" data-certificate-print>Print / save as PDF</button>
          <a class="btn btn--ghost" href="/certificates.html">All certificates</a>
        </div>

        <div data-page-error></div>
      </div>

    </main>

    <footer class="site-footer" data-site-footer></footer>

    <noscript>
      <div class="container alert alert--warning mb-4">
        <p><strong>JavaScript is off.</strong> Browsing, reading lesson previews and
        verifying a certificate still work, because each page ships real HTML and the
        server renders the content. Signing in, enrolling, tracking progress and taking
        quizzes need JavaScript — the whole app is a set of ES modules talking to the
        G WORLD API.</p>
      </div>
    </noscript>

    <script type="module">
      import { boot } from '/assets/js/core/boot.js';
      import { init } from '/assets/js/pages/certificate.js';
      boot(init);
    </script>
  </body>
</html>
