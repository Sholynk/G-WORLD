<!doctype html>
<html lang="en" data-page="lesson">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lesson · G WORLD</title>
    <meta name="description" content="Lesson video, notes, resources and progress for an enrolled G WORLD learner.">
    <link rel="canonical" href="https://gworld.pages.dev/lesson.html">
    <meta name="theme-color" content="#4f46e5">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="stylesheet" href="/assets/css/tokens.css">
    <link rel="stylesheet" href="/assets/css/base.css">
    <link rel="stylesheet" href="/assets/css/layout.css">
    <link rel="stylesheet" href="/assets/css/components.css">
    <link rel="stylesheet" href="/assets/css/forms.css">
    <link rel="stylesheet" href="/assets/css/tables.css">
    <link rel="stylesheet" href="/assets/css/animations.css">
    <!-- Public runtime configuration (no secrets). Loaded before the modules. -->
    <script src="/config.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>

    <!-- Header and footer are rendered by assets/js/components/*.js so the
         navigation exists in exactly one place. -->
    <header class="site-header" data-site-header></header>

    <main id="main" class="site-main" tabindex="-1">
      <div class="container container--wide">
        <p class="breadcrumbs">
          <a href="/courses.html">Courses</a> /
          <a data-lesson-course-link>Course</a> /
          <span data-lesson-crumb>Lesson</span>
        </p>

        <div class="lesson-layout">
          <div class="stack">
            <header class="stack-sm">
              <p class="page-head__eyebrow" data-lesson-module>Module</p>
              <h1 data-lesson-title>Loading lesson…</h1>
              <p class="cluster cluster--tight">
                <span class="badge" data-lesson-duration>—</span>
                <span class="badge" data-lesson-status>—</span>
                <span class="badge" data-lesson-rule>—</span>
              </p>
            </header>

            <div data-lesson-locked hidden></div>

            <section data-lesson-content-wrap hidden>
              <h2 id="video-heading">Video</h2>
              <div class="video-frame" data-lesson-video></div>
              <ul class="video-list mt-4" data-lesson-videos></ul>

              <section class="mt-5" aria-labelledby="notes-heading">
                <h2 id="notes-heading">Lesson notes</h2>
                <!-- data-lesson-body receives server-rendered HTML: the API
                     escapes authored Markdown before adding formatting, so this
                     string is safe (see apps/api/src/lib/text.ts). -->
                <div class="lesson-body" data-lesson-body></div>
              </section>

              <section class="mt-5" aria-labelledby="objectives-heading" data-lesson-objectives-wrap hidden>
                <h2 id="objectives-heading">By the end of this lesson</h2>
                <ul data-lesson-objectives></ul>
              </section>

              <section class="mt-5" aria-labelledby="resources-heading" data-lesson-resources-wrap hidden>
                <h2 id="resources-heading">Resources</h2>
                <ul class="list-plain stack-sm" data-lesson-resources></ul>
              </section>
            </section>

            <nav class="cluster cluster--between" data-lesson-nav aria-label="Lesson navigation">
              <a class="btn" data-nav-prev hidden>Previous lesson</a>
              <a class="btn" data-nav-next hidden>Next lesson</a>
            </nav>

            <div data-page-error></div>
          </div>

          <aside class="stack" aria-label="Course progress">
            <div class="card">
              <div class="card__section stack-sm">
                <div class="progress__label">
                  <span>Course progress</span>
                  <span data-progress-percent>0%</span>
                </div>
                <span class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" data-progress>
                  <span class="progress__bar" data-progress-bar style="--progress-value: 0%"></span>
                </span>
                <p class="subtle mb-0" data-progress-detail></p>
                <button class="btn btn--primary btn--block" type="button" data-complete-lesson>Mark lesson complete</button>
                <p class="subtle mb-0" data-complete-status role="status" aria-live="polite"></p>
              </div>
            </div>

            <div class="card">
              <div class="card__section">
                <h2 class="card__title">Course outline</h2>
                <ol class="curriculum" data-lesson-outline></ol>
              </div>
            </div>
          </aside>
        </div>
      </div>

    </main>

    <footer class="site-footer" data-site-footer></footer>

    <noscript>
      <div class="container alert alert--warning mb-4">
        <p><strong>JavaScript is off.</strong> Browsing, reading lesson previews and
        verifying a certificate still work, because each page ships real HTML and the
        server renders the content. Signing in, enrolling, tracking progress and taking
        quizzes need JavaScript — the whole app is a set of ES modules talking to the
        G WORLD API.</p>
      </div>
    </noscript>

    <script type="module">
      import { boot } from '/assets/js/core/boot.js';
      import { init } from '/assets/js/pages/lesson.js';
      boot(init);
    </script>
  </body>
</html>
