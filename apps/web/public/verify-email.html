<!doctype html>
<html lang="en" data-page="verify-email">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Confirm your email · G WORLD</title>
    <meta name="description" content="Confirm the email address on your G WORLD account.">
    <link rel="canonical" href="https://gworld.pages.dev/verify-email.html">
    <meta name="theme-color" content="#4f46e5">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="stylesheet" href="/assets/css/tokens.css">
    <link rel="stylesheet" href="/assets/css/base.css">
    <link rel="stylesheet" href="/assets/css/layout.css">
    <link rel="stylesheet" href="/assets/css/components.css">
    <link rel="stylesheet" href="/assets/css/forms.css">
    <link rel="stylesheet" href="/assets/css/tables.css">
    <link rel="stylesheet" href="/assets/css/animations.css">
    <!-- Public runtime configuration (no secrets). Loaded before the modules. -->
    <script src="/config.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>

    <!-- Header and footer are rendered by assets/js/components/*.js so the
         navigation exists in exactly one place. -->
    <header class="site-header" data-site-header></header>

    <main id="main" class="site-main" tabindex="-1">
      <div class="container container--narrow">
        <div class="page-head">
          <h1>Confirm your email</h1>
          <p class="lede mb-0" data-verify-lede>Checking your confirmation link…</p>
        </div>

        <div class="card" data-verify-card>
          <div class="card__section stack-sm">
            <p class="badge" data-verify-badge>Pending</p>
            <p data-verify-message>The link in your email activates your account.</p>
          </div>
          <div class="card__footer cluster">
            <a class="btn btn--primary" href="/login.html">Go to sign in</a>
            <a class="btn btn--ghost" href="/dashboard.html">Open my dashboard</a>
          </div>
        </div>

        <section class="mt-5" data-resend hidden aria-labelledby="resend-heading">
          <h2 id="resend-heading">Need a new link?</h2>
          <form class="form form--narrow" data-resend-form novalidate>
            <div class="field">
              <label for="resend-email">Email address</label>
              <input id="resend-email" name="email" type="email" autocomplete="email" required>
            </div>
            <div class="form__actions">
              <button class="btn" type="submit">Send a new confirmation link</button>
            </div>
            <p class="form-status" data-resend-status role="status" aria-live="polite"></p>
          </form>
        </section>

        <div data-page-error></div>
      </div>

    </main>

    <footer class="site-footer" data-site-footer></footer>

    <noscript>
      <div class="container alert alert--warning mb-4">
        <p><strong>JavaScript is off.</strong> Browsing, reading lesson previews and
        verifying a certificate still work, because each page ships real HTML and the
        server renders the content. Signing in, enrolling, tracking progress and taking
        quizzes need JavaScript — the whole app is a set of ES modules talking to the
        G WORLD API.</p>
      </div>
    </noscript>

    <script type="module">
      import { boot } from '/assets/js/core/boot.js';
      import { init } from '/assets/js/pages/verify-email.js';
      boot(init);
    </script>
  </body>
</html>
