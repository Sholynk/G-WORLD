# Sholynk Tech — continuous integration.
#
# The same commands a developer runs locally, in the same order, on the same Node
# version: `npm ci` re-installs from the lock file exactly as Cloudflare's build
# image does (so a manifest/lock-file drift fails here instead of on a deploy),
# and `npm run verify` runs every gate the toolchain ships with.
#
# Deliberately not here yet (planned, see docs/02-file-structure.md):
#   · deploy-api.yml — D1 migrations + `wrangler deploy` behind a manual gate
#   · deploy-web.yml — `wrangler pages deploy` on main
# Both need repository secrets; the Pages project is currently built by Cloudflare
# from this repository instead.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: install, check, typecheck, test, browser
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js from .nvmrc
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # Fails on drift between package.json and package-lock.json — the same
      # EUSAGE failure that stops the Cloudflare build before it starts.
      - name: Install dependencies (npm ci)
        run: npm ci --progress=false

      - name: Seed local test database
        run: npm run db:seed:local -- --verify

      # Integration tests must exercise a running Worker, not silently skip.
      - name: Start local website and API
        run: |
          npm run dev > /tmp/sholynk-dev.log 2>&1 &
          node --input-type=module <<'JS'
          for (const url of ['http://127.0.0.1:8787/api/v1/health/ready', 'http://127.0.0.1:5173/']) {
            let ready = false;
            for (let i = 0; i < 90; i++) {
              try {
                const response = await fetch(url, { signal: AbortSignal.timeout(1000) });
                if (response.ok) { ready = true; break; }
              } catch {}
              await new Promise(resolve => setTimeout(resolve, 1000));
            }
            if (!ready) throw new Error(`Local test server did not start: ${url}`);
          }
          JS

      - name: Verify
        run: npm run verify

      # The gate Cloudflare runs before uploading apps/web/public. Catches broken
      # routing rules and page links before they reach production.
      - name: Frontend build (Cloudflare-equivalent, runs the Pages gate)
        run: npm run build:web

      - name: Worker build (dry run only)
        run: npm run build

      - name: API and website smoke tests
        run: npm run test:smoke && npm run test:web

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Desktop and mobile browser checks
        run: npm run test:browser
